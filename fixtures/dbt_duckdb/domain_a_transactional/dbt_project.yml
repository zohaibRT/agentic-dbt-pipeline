name: domain_a_transactional
version: '1.0.0'
config-version: 2
profile: fixture_duckdb
model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
target-path: target
clean-targets:
  - target
  - dbt_packages
seeds:
  +schema: main
snapshots:
  domain_a_transactional:
    +target_schema: snapshots
models:
  domain_a_transactional:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    gold:
      +materialized: table
