# Skill repo: validates scripts and skill configuration on every PR.
# Generated dbt projects: copy this workflow and uncomment warehouse steps when CI credentials exist.
name: dbt Acceptance Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  skill-repo-validation:
    name: Skill repo validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: pip install pyyaml

      - name: Validate skill configuration
        run: python scripts/validate_config.py --root .

      - name: Compile Python scripts
        run: python -m compileall scripts

