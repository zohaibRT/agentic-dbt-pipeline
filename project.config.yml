# Edit this file when starting a new source system or environment.
# The agent reads this before building dbt layers.

project:
  name: auto                 # derive from repo/source/profile metadata; see references/project-naming.md
  root: auto                 # default to project.name unless explicitly overridden
  profile: auto              # use DBT_PROFILE_NAME or ask; never infer from project name

database:
  adapter: auto               # resolve from selected DBT_PROFILE_NAME in ~/.dbt/profiles.yml
  host: selected_profile_host
  port: selected_profile_port
  dbname: selected_profile_database
  target_schema: dbt_work
  threads: 4
  # password: NEVER store here - use ~/.dbt/profiles.yml

targets:
  default: dev
  available:
    - dev
    - ci
    - prod

source:
  name: auto
  schema: raw
  yaml_path: models/sources/raw_sources_generated.yml

schema_isolation:
  source_read_only: true
  work_schema_suffix: work
  seeds_schema_suffix: seeds
  snapshots_schema_suffix: snapshots
  evaluator_schema_suffix: evaluator
  audit_schema_suffix: audit
  allow_dbt_outputs_in_source_schema: false

agents:
  schema: AGENTS
  github_secret: WAREHOUSE_CREDENTIALS
  workflow_version: v0.0.9
  supported_destinations:
    - snowflake
    - databricks
    - bigquery

packages:
  - package: dbt-labs/codegen
    version: 0.14.1
  - package: dbt-labs/dbt_utils
    version: 1.3.3
  - package: calogica/dbt_expectations
    version: 0.10.4
  - package: dbt-labs/dbt_project_evaluator
    version: 1.3.0
  - package: dbt-labs/audit_helper
    version: 0.14.0

dbt_agent_skills:
  install_command: npx skills add dbt-labs/dbt-agent-skills/skills/dbt
  required:
    - using-dbt-for-analytics-engineering
    - running-dbt-commands
    - building-dbt-semantic-layer
    - troubleshooting-dbt-job-errors
  optional:
    - adding-dbt-unit-test
    - answering-natural-language-questions-with-dbt

business_context:
  domain: auto               # analytics context only; not a folder/schema prefix
  description: auto          # optional DBT_BUSINESS_DESCRIPTION free text

project_slug: auto           # stable folder slug derived by references/project-naming.md
schema_prefix: auto          # physical warehouse prefix derived by references/schema-isolation.md

# Analytics completion policy (domain-neutral; process coverage by default).
# Fixed catalog counts are advisory only when set; null disables count gates.
analytics_policy:
  completion_mode: process_coverage
  advisory_measure_target: null
  advisory_metric_target: null
  critical_fact_coverage_required: 1.0
  critical_kpi_contract_coverage_required: 1.0
  critical_reconciliation_coverage_required: 1.0
  business_process_coverage_required: 0.9
  time_intelligence_coverage_required: 0.8
  model_classification_coverage_required: 1.0
  business_label_coverage_required: 1.0
  report_traceability_required: 1.0
  rendered_proof_coverage_required: 1.0
  report_page_contract_coverage_required: 1.0
  observability_domain_coverage_required: 1.0
  critical_data_quality_coverage_required: 1.0
  critical_process_module_coverage_required: 1.0
  production_exposure_coverage_required: 1.0
  # Warning fail-at-final: use acceptance_policy.final_fail_on_warning (single source of truth).

presentation_policy:
  require_stable_visual_ids: true
  require_bidirectional_page_contract_mapping: true
  require_bidirectional_proof_mapping: true
  approved_kpis_required_for_trusted_executive_pages: true
  pending_kpis_allowed_in_draft_pages: true
  require_tooltip_contract: true
  require_static_fallback: true
  require_accessible_data_table: true
  require_offline_interactive_dependency: true
  interactive_renderer: plotly
  static_renderer: matplotlib
  require_live_browser_validation: true
  live_browser_viewports:
    - desktop
    - tablet
    - mobile
  render_modes:
    - auto
    - interactive_html
    - static_image

resource_classification_policy:
  require_enabled_local_models: true
  require_sources: true
  require_seeds: true
  require_snapshots: true
  require_semantic_models: true
  require_metrics: true
  require_exposures: true
  require_tests_individually: false
  require_dependency_package_models: false
  local_resource_coverage_required: 1.0
  production_resource_coverage_required: 1.0

acceptance_policy:
  final_fail_on_warning: true
  require_explicit_warning_acceptance: true

layer_names:
  ask_user: false
  layer_1: bronze
  layer_2: silver
  layer_3: gold

layer_roles:
  - sources
  - layer_1
  - layer_2
  - layer_3

paths:
  sources: models/sources
  layer_1: models/bronze/{project_slug}
  layer_2: models/silver/{project_slug}
  layer_3: models/gold/{project_slug}

naming:
  layer_1_prefix: stg_{source}__
  layer_2_prefix: int_{source}__
  layer_1_yaml: _stg_{source}.yml
  layer_2_yaml: _int_{source}.yml
  layer_3_yaml: _{project_slug}_marts.yml

examples:
  source: "source('<source_name>', '<source_table>')"
  layer_1: stg_<source_name>__<source_table>
  layer_2: int_<source_name>__<business_process_or_entity>
  layer_3: dim_<business_entity> or fct_<business_event> or mart_<business_process>

dbt:
  executable: dbt
  executable_windows_fallback: '%APPDATA%/Python/Python312/Scripts/dbt.exe'
  core_version: '1.10.15'
  adapter_version: '1.10.0'
  parse_flags: '--no-partial-parse'
  build_selectors:
    layer_1: '+path:models/bronze/{project_slug}'
    layer_2: '+path:models/silver/{project_slug}'
    layer_3: '+path:models/gold/{project_slug}'

materialization_profile: prod
materialization:
  staging: view
  intermediate: view
  marts: table
  marts_fact_default: incremental
  marts_dim_default: table
  marts_reporting_default: table
  dev_override_all: view

docs:
  generate_after_build: true
  serve_on_request: true
  host: 127.0.0.1
  port: 8080

git:
  ask_after_each_layer: true
  default_commit_mode: ask
  push_to_github: ask            # local-only disables push; otherwise ask before pushing
  use_gh_cli_account: true       # owner from `gh api user --jq .login`
  github_repo_name: null         # prompt: github_repo_name - ask user for repo slug only
  remote: null                   # resolved: https://github.com/{gh_user}/{github_repo_name}.git
  branch: main
  exclude:
    - .venv
    - target
    - logs
    - dbt_packages
    - .env
    - profiles.yml

commit_messages:
  init: 'Initialize dbt project'
  packages: 'Add dbt packages'
  package_lock: 'Install dbt packages'
  config: 'Configure dbt profile and source settings'
  sources: 'Define dbt sources'
  layer_1: 'Add dbt staging layer for {source} sources.'
  layer_2: 'Add dbt intermediate layer for {source} analytics.'
  layer_3: 'Add dbt marts layer for {source} star schema.'
  semantic_layer: 'Add semantic layer metrics for {source}'
  project_evaluator: 'Configure and run dbt project evaluator'
  docs: 'Add dbt tests and documentation'
  analytics_insight_reporting: 'Add analytics insight reporting design'
  ci: 'Add dbt automation workflows'
  agents_schema: 'Add Agents Schema sync workflow'

workflow_phases:
  - project_setup
  - init
  - sources
  - staging
  - intermediate
  - marts
  - semantic_layer
  - project_evaluator
  - docs
  - analytics_insight_reporting
  - presentation_layer
  - ci
  - agents_schema

auto_bootstrap:
  default: true
  install_dbt_labs_skills: true
  run_dbt_deps_on_sources: true
  create_ci_workflow: false
  create_agents_schema_workflow: false
  # Continuous integration and Agents Schema workflows belong to approved automation phases.
  # User must add WAREHOUSE_CREDENTIALS in GitHub UI - agent cannot create secrets

human_in_loop_policy:
  production_kpi_approval_required: 1.0
  require_named_owner: true
  require_named_approver: true
  require_approval_evidence: true
  require_approval_date: true
  stale_approval_blocks_final: true
  unresolved_critical_decisions_block_final: true
  conditional_approval_requires_review_condition: true
  allow_technical_work_without_business_approval: true
  allow_unapproved_kpis_in_draft_reports: true
  allow_unapproved_kpis_in_trusted_executive_reports: false